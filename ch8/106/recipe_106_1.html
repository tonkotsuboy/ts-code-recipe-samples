<!-- Recipe 106_1: ブラウザーで type="module" を付けてトップレベル await を使う -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Recipe 106_1 top-level await</title>
  </head>
  <body>
    <script type="module">
      const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
      const data = await response.json();
      console.log(data);
    </script>
  </body>
</html>
